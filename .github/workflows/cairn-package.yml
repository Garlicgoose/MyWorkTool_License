name: Publish Cairn package
on:
  workflow_dispatch:
  push:
    paths: [cairn/package-manifest.json]
permissions:
  contents: write
concurrency:
  group: cairn-package-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          document=json.loads(Path('cairn/package-manifest.json').read_text())
          assert re.fullmatch(r'[0-9.]+',document['version'])
          assert re.fullmatch(r'cairn-v[0-9.]+',document['tag'])
          assert Path(document['filename']).name==document['filename']
          assert document['filename'].endswith('.exe')
          root=Path('cairn').resolve()
          output=Path(os.environ['RUNNER_TEMP'])/document['filename']
          sha=hashlib.sha256();size=0
          with output.open('wb') as destination:
              for part in document['parts']:
                  path=(root/part['file']).resolve()
                  assert path.is_relative_to(root)
                  data=path.read_bytes()
                  assert len(data)==part['size'] and hashlib.sha256(data).hexdigest()==part['sha256']
                  destination.write(data);sha.update(data);size+=len(data)
          assert size==document['size'] and sha.hexdigest()==document['sha256']
          with open(os.environ['GITHUB_ENV'],'a') as environment:
              environment.write('PACKAGE_FILE='+str(output)+'\nRELEASE_TAG='+document['tag']+'\n')
          Path('cairn/release-notes.txt').write_text('\n'.join(document['notes'])+'\n')
          print('Verified complete installer:',document['sha256'])
          PY
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_FILE" --title 'Cairn 1.08' --notes-file cairn/release-notes.txt
          fi
      - name: Publish update manifest
        env:
          PUBLISH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          document=json.loads(Path('cairn/package-manifest.json').read_text())
          manifest={'version':document['version'],'installer_url':'https://github.com/'+os.environ['PUBLISH_REPOSITORY']+'/releases/download/'+document['tag']+'/'+document['filename'],'sha256':document['sha256'],'notes':document['notes']}
          Path('cairn/update.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cairn/update.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Cairn 1.08 update manifest'
          git pull --rebase origin main
          git push origin HEAD:main
